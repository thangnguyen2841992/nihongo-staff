# Production rejects weaker overrides at startup.
security:
  origin-check:
    enabled: true
  session-validation:
    enabled: true
  jwt:
    mode: rsa
    allow-legacy-hmac: false
    validate-claims: true


spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate