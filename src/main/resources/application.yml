server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8085
  compression:
    enabled: true
    min-response-size: 1024
spring:
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 320MB
  application:
    name: staff-service
  datasource:
    url: jdbc:mariadb://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?sslMode=disable&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
    username: tsezwyvdhosting_nihongo_app
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME:900000}
      keepalive-time: ${DB_CONNECTION_KEEPALIVE:60000}
      idle-timeout: ${DB_CONNECTION_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        default_batch_fetch_size: 50
        # Grouped monitor saves update several assignment rows per transaction; send them as one batch.
        order_updates: true
        jdbc:
          fetch_size: 100
          batch_size: 50

content-cache:
  maximum-size: ${CONTENT_CACHE_MAX_SIZE:2000}
  expire-after-write: ${CONTENT_CACHE_TTL:PT5M}

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_ADVERTISED_ADDRESS:127.0.0.1}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

monitoring:
  prometheus-targets-file: ${PROMETHEUS_TARGETS_FILE:${user.home}/Downloads/prometheus-3.15.0.windows-amd64/targets/node_targets.json}
  prometheus-windows-targets-file: ${PROMETHEUS_WINDOWS_TARGETS_FILE:${user.home}/Downloads/prometheus-3.15.0.windows-amd64/targets/windows_targets.json}

jwt:
  secret: ${JWT_SECRET:}

voicevox:
  url: ${VOICEVOX_URL:http://127.0.0.1:50021}
  cache-dir: ${VOICEVOX_CACHE_DIR:${user.home}/.nihongo/voicevox-cache}
