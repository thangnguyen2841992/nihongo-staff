server:
  port: 8085
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 320MB
  config:
    import: "optional:file:./.local/shared.properties,optional:file:../.local/shared.properties,optional:file:./.local/gemini.properties,optional:file:../.local/gemini.properties"
  application:
    name: staff-service
  datasource:
    url: jdbc:mysql://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
    username: tsezwyvdhosting_nihongo_app
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 45000
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

monitoring:
  prometheus-targets-file: ${PROMETHEUS_TARGETS_FILE:${user.home}/Downloads/prometheus-3.15.0.windows-amd64/targets/node_targets.json}
  prometheus-windows-targets-file: ${PROMETHEUS_WINDOWS_TARGETS_FILE:${user.home}/Downloads/prometheus-3.15.0.windows-amd64/targets/windows_targets.json}

jwt:
  secret: ${JWT_SECRET}

voicevox:
  url: ${VOICEVOX_URL:http://127.0.0.1:50021}
  cache-dir: ${VOICEVOX_CACHE_DIR:${user.home}/.nihongo/voicevox-cache}
